# ============================================================================
# MANUAL ONLY — the production sync does not run here.
#
# The weekly TMDB sync runs on the Unraid host as a User Script:
#   Sync-TMDB-Dashboard — Sundays at 3:00 AM local time
#   docker exec dashboard-app python scripts/sync_tmdb_data.py --limit 5000
#
# The production database is the `dashboard-db` Postgres container, reachable
# only on the LAN, so GitHub's hosted runners cannot connect to it. This
# workflow is kept for a hand-run sync against some other, publicly reachable
# database: set the SYNC_DATABASE_URL secret first. (The old
# RAILWAY_DATABASE_URL secret went away with the Railway project.)
# ============================================================================

name: Sync TMDB Data

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of movies to sync'
        required: false
        default: '5000'
      update_existing:
        description: 'Update existing movies'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TMDB sync
        env:
          DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Inputs pass through env, never pasted into the script text
          SYNC_LIMIT: ${{ github.event.inputs.limit }}
          SYNC_UPDATE: ${{ github.event.inputs.update_existing }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Set the SYNC_DATABASE_URL secret first." >&2
            exit 1
          fi
          case "$SYNC_LIMIT" in
            ''|*[!0-9]*) echo "limit must be a whole number" >&2; exit 1 ;;
          esac

          ARGS=(--limit "$SYNC_LIMIT")
          if [ "$SYNC_UPDATE" = "true" ]; then
            ARGS+=(--update-existing)
          fi

          echo "Running: python scripts/sync_tmdb_data.py ${ARGS[*]}"
          python scripts/sync_tmdb_data.py "${ARGS[@]}"
