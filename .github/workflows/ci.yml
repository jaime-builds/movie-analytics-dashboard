name: CI/CD — Movie Analytics Dashboard

# Builds and pushes the Docker Hub image only after the Tests workflow has
# passed on a push to main, so an untested commit never becomes :latest.
# (Production on Unraid builds from its own checkout, not from this image.)
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly the commit the Tests workflow checked
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-analytics-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-analytics-dashboard:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
