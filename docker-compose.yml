# Local development only. Production runs the `movie-dashboard` stack on
# Unraid (dashboard-app + dashboard-db, Postgres), defined in that host's
# compose file, not this one.
#
# Usage: docker compose up --build
# Data and logs live in named volumes, which Docker creates with the right
# owner for the container's non-root user (a bind-mounted host folder would
# be created root-owned, and the app couldn't write to it).
services:
  web:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - config/.env
    environment:
      PORT: "8080"
      DATABASE_URL: "sqlite:////app/data/movies.db"
    volumes:
      - dashboard-data:/app/data
      - dashboard-logs:/app/logs
    restart: unless-stopped
    # The image defines its own HEALTHCHECK against /api/v1/health

volumes:
  dashboard-data:
  dashboard-logs:
