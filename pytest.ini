[pytest]
# Pytest configuration (coverage settings live in .coveragerc)
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
filterwarnings =
    # The suite disables caching on purpose
    ignore:Flask-Caching. CACHE_TYPE is set to NullCache:UserWarning
